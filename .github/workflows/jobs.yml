name: Jobs
on: 
  workflow_dispatch:
    inputs:
      domain:
        default: 'testspace.com'
  
jobs:
  int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Testspace client install & config
        uses: testspace-com/setup-testspace@v1
        with:
          domain: http://mark.testspace.test:3000
          token: tsu_50cec0bac7706c157662bf25e5b1ba89099e8785
      - name: Testspace push test content
        run: |
          touch github_run.txt
          env >> git_run.txt
          testspace git_run.txt
  this-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Testspace client install & config
        uses: testspace-com/setup-testspace@v1
        with:
          domain: http://mark.testspace.test:3000
          token: tsu_50cec0bac7706c157662bf25e5b1ba89099e8785
      - name: Testspace push test content
        run: testspace "[${{ github.workflow }}/${{ github.job}}]./testcontent/*.xml"
  that-job:
    runs-on: ubuntu-latest
